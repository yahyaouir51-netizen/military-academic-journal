<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- دائرة خارجية -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1a3a52" stroke-width="3"/>
  
  <!-- نجمة عسكرية وسطية -->
  <g transform="translate(100, 100)">
    <!-- نجمة ذهبية -->
    <polygon points="0,-40 9.5,-12.5 40,-12.5 15,10 23,40 0,20 -23,40 -15,10 -40,-12.5 -9.5,-12.5" 
             fill="#d4af37" stroke="#1a3a52" stroke-width="1"/>
    
    <!-- درع أسفل النجمة -->
    <path d="M -25,15 L -25,45 Q 0,55 25,45 L 25,15 Z" 
          fill="#1a3a52" stroke="#d4af37" stroke-width="2"/>
    
    <!-- خط أفقي داخل الدرع -->
    <line x1="-20" y1="30" x2="20" y2="30" stroke="#d4af37" stroke-width="1.5"/>
  </g>
  
  <!-- النص (يمكن تعديله في HTML) -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="12" 
        text-anchor="middle" fill="#1a3a52" font-weight="bold">
    الدراسات العسكرية والأكاديمية
  </text>
</svg>